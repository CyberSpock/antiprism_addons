[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antiprism-addons"
dynamic = ["version"]
description = "Additional polyhedral geometry tools for Antiprism"
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "0BSD"
authors = [{ name = "Roger Kaufman", email = "polyhedrasmith@gmail.com" }]
keywords = ["polyhedra", "antiprism", "geometry", "3d", "off"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/CyberSpock/antiprism_addons"
Repository = "https://github.com/CyberSpock/antiprism_addons"
Documentation = "https://github.com/CyberSpock/antiprism_addons"

[project.scripts]
anemone = "anemone:main"
color_wheel = "color_wheel:main"
embeddip = "embeddip:main"
inscribe = "inscribe:main"
kaufman = "kaufman:main"
noble = "noble:main"
offanim = "offanim:main"
offview = "offview:main"
pyr2trap = "pyr2trap:main"
rotyz = "rotyz:main"
scrunchie = "scrunchie:main"
scrunchie_math = "scrunchie_math:main"
stella = "stella:main"
stepview = "stepview:main"
trapstel = "trapstel:main"
vr1tovr2 = "vr1tovr2:main"
x3dview = "x3dview:main"

[tool.setuptools]
include-package-data = false
py-modules = [
    "anti_common",
    "anemone",
    "color_wheel",
    "embeddip",
    "inscribe",
    "kaufman",
    "noble",
    "offanim",
    "offview",
    "pyr2trap",
    "rotyz",
    "scrunchie",
    "scrunchie_math",
    "stella",
    "stepview",
    "trapstel",
    "vr1tovr2",
    "x3dview",
]

[tool.setuptools.dynamic]
version = {attr = "anti_common.ADDONS_VERSION"}
